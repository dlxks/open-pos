name: Native artifacts

on:
  workflow_dispatch:
    inputs:
      hub_url:
        description: HTTPS base URL used by the register app at build time
        required: true
        type: string
      app_version:
        description: Numeric application version, for example 1.2.3
        required: true
        type: string
      sign_android:
        description: Sign the Android bundle using configured repository secrets
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  POS_HUB_URL: ${{ inputs.hub_url || vars.POS_HUB_URL || 'https://pos.example.com' }}
  POS_APP_VERSION: ${{ inputs.app_version || github.ref_name || '1.0.0' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare optional Android signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_android }}
        working-directory: apps/register
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.OPEN_POS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/open-pos-release.jks"
      - name: Build Android app bundle
        working-directory: apps/register
        env:
          OPEN_POS_ANDROID_KEYSTORE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_android && format('{0}/open-pos-release.jks', runner.temp) || '' }}
          OPEN_POS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPEN_POS_ANDROID_KEYSTORE_PASSWORD }}
          OPEN_POS_ANDROID_KEY_ALIAS: ${{ secrets.OPEN_POS_ANDROID_KEY_ALIAS }}
          OPEN_POS_ANDROID_KEY_PASSWORD: ${{ secrets.OPEN_POS_ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${POS_APP_VERSION#v}"
          flutter build appbundle --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="POS_HUB_URL=$POS_HUB_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: open-pos-android-${{ inputs.sign_android && 'signed' || 'unsigned' }}
          path: apps/register/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows desktop app
        working-directory: apps/register
        shell: pwsh
        run: |
          $version = $env:POS_APP_VERSION.TrimStart('v')
          flutter build windows --release `
            --build-name=$version `
            --build-number=$env:GITHUB_RUN_NUMBER `
            --dart-define=POS_HUB_URL=$env:POS_HUB_URL
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/open-pos-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: open-pos-windows-x64
          path: apps/register/build/open-pos-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Linux desktop app
        working-directory: apps/register
        run: |
          VERSION="${POS_APP_VERSION#v}"
          flutter build linux --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="POS_HUB_URL=$POS_HUB_URL"
          tar -czf build/open-pos-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: open-pos-linux-x64
          path: apps/register/build/open-pos-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS desktop app
        working-directory: apps/register
        run: |
          VERSION="${POS_APP_VERSION#v}"
          flutter build macos --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="POS_HUB_URL=$POS_HUB_URL"
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/open-pos-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: open-pos-macos
          path: apps/register/build/open-pos-macos.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build unsigned iOS app bundle
        working-directory: apps/register
        run: |
          VERSION="${POS_APP_VERSION#v}"
          flutter build ios --release --no-codesign \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="POS_HUB_URL=$POS_HUB_URL"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/open-pos-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: open-pos-ios-unsigned
          path: apps/register/build/open-pos-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
